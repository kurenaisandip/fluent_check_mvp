name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Exclude workspace from Windows Defender scans
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue; Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build Windows app (release)
        run: flutter build windows --release

      - name: Diagnose install failure
        if: failure()
        shell: pwsh
        run: |
          $cmake = (Get-Command cmake.exe -ErrorAction SilentlyContinue).Source
          if (-not $cmake) { $cmake = "C:/Program Files/Microsoft Visual Studio/18/Enterprise/Common7/IDE/CommonExtensions/Microsoft/CMake/CMake/bin/cmake.exe" }
          Get-ChildItem -Path "build/windows/x64" -Filter "cmake_install.cmake" -Recurse | ForEach-Object {
            Write-Host "=== Running install script: $($_.FullName) ==="
            & $cmake -DBUILD_TYPE=Release -P $_.FullName
            Write-Host "=== Exit code: $LASTEXITCODE ==="
          }

      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "fluent_check_mvp-windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fluent_check_mvp-windows-${{ github.sha }}
          path: fluent_check_mvp-windows.zip
          retention-days: 14

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fluent_check_mvp-windows.zip
          generate_release_notes: true
